<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超级马里奥 · Super Mario (纯代码绘制版 · 全三关)</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(1200px 700px at 50% 20%, #22345c 0%, #10182e 55%, #070b16 100%);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,.65), 0 0 0 4px rgba(255,255,255,.06);
    background: #5c94fc;
  }
  /* ---- 触屏按钮 ---- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }
  body.hasTouch #touch { display: block; }
  .tbtn {
    position: absolute; bottom: 22px;
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,.14);
    border: 2px solid rgba(255,255,255,.35);
    color: #fff; font-size: 30px; line-height: 70px; text-align: center;
    pointer-events: auto;
    backdrop-filter: blur(2px);
  }
  .tbtn:active, .tbtn.on { background: rgba(255,255,255,.38); }
  #btnL { left: 22px; }
  #btnR { left: 112px; }
  #btnJ { right: 22px; width: 92px; height: 92px; line-height: 88px; font-size: 34px;
          background: rgba(231,60,46,.30); border-color: rgba(255,150,140,.6); }
  #hint {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    color: rgba(255,255,255,.45); font-size: 12px; letter-spacing: 1px; z-index: 5;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="864" height="480"></canvas></div>
<div id="touch">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnJ">A</div>
</div>
<div id="hint">纯 Canvas 代码绘制 · 无任何图片素材 · 全三关</div>

<script>
"use strict";
/* =========================================================
 *  超级马里奥 · 纯代码绘制版（全三关）
 *  所有图形（角色/敌人/地形/背景）均由 Canvas API 程序化绘制，
 *  所有音效均由 WebAudio 振荡器实时合成，未使用任何外部素材。
 *
 *  世界 1-1  绿野平原   经典地上关卡
 *  世界 2-1  地下迷窟   洞窟主题 · 砖块隧道 · 更多敌人
 *  世界 3-1  星空险境   夜空主题 · 浮空平台 · 快速敌人
 * ========================================================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 864, H = 480, TILE = 32;
const ROWS = 15;                 // 15 * 32 = 480
const GROUND_R = 13;             // 地面顶部所在行
const MAX_WORLD = 3;
const WORLD_NAMES = ['绿野平原', '地下迷窟', '星空险境'];

/* ================= 画布自适应 ================= */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.97;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('hasTouch');

/* ================= 音效合成（WebAudio） ================= */
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!actx) return;
  type = type || 'square'; vol = vol == null ? 0.06 : vol; delay = delay || 0;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, f0), t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const SFX = {
  jump()  { tone(260, 620, 0.16, 'square', 0.045); },
  coin()  { tone(988, 988, 0.07, 'square', 0.05); tone(1319, 1319, 0.32, 'square', 0.05, 0.07); },
  stomp() { tone(320, 90, 0.12, 'triangle', 0.12); },
  bump()  { tone(130, 80, 0.07, 'square', 0.09); },
  die()   { tone(494,494,.12,'square',.06,0); tone(466,466,.12,'square',.06,.12);
            tone(440,440,.12,'square',.06,.24); tone(392,120,.5,'square',.06,.36); },
  win()   { const m=[523,659,784,1047,784,1047];
            m.forEach((f,i)=>tone(f,f,.14,'square',.055,i*.11));
            tone(1319,1319,.5,'square',.05,m.length*.11); },
  intro() { tone(392,392,.1,'square',.05); tone(523,523,.1,'square',.05,.1); tone(659,659,.22,'square',.05,.2); }
};

/* ================= 关卡数据 ================= */
let world = 1;
let LEVEL_W = 178;
let grid = [];           // grid[r][c]
let pipes = [];          // {c,r,w,h}
let enemySpawns = [];    // 每关独立的敌人出生列
let flagX = 160;         // 旗杆所在列
let castleC = 165;       // 城堡装饰位置（列）
let spawn = { x: 64 };

/* ---- 建图辅助（操作当前 grid） ---- */
function set(c, r, ch) { if (c >= 0 && c < LEVEL_W && r >= 0 && r < ROWS) grid[r][c] = ch; }
function ground(a, b) { for (let c = a; c <= b; c++) { set(c, 13, '#'); set(c, 14, '#'); } }
function pipe(c, h) {
  pipes.push({ c, r: 13 - h, w: 2, h });
  for (let r = 13 - h; r < 13; r++) { set(c, r, 'P'); set(c + 1, r, 'P'); }
}
function coinsRow(a, b, r) { for (let c = a; c <= b; c++) set(c, r, 'C'); }
function stair(c, h, dir) {           // dir=1 上升，-1 下降
  for (let i = 0; i < h; i++) {
    const hh = dir > 0 ? i + 1 : h - i;
    for (let k = 0; k < hh; k++) set(c + i, 12 - k, '#');
  }
}
function tower(c, h) { for (let k = 0; k < h; k++) set(c, 12 - k, '#'); }
function bricksRow(a, b, r, ch) { for (let c = a; c <= b; c++) set(c, r, ch || 'B'); }

/* ---------- 世界 1-1 · 绿野平原（原关卡） ---------- */
function buildWorld1() {
  LEVEL_W = 178; flagX = 160; castleC = 165;
  spawn = { x: 64 };
  enemySpawns = [13, 26, 31, 44, 46, 61, 77, 80, 92, 103, 107, 120, 125, 135, 139, 144];

  ground(0, 35);  ground(38, 55);  ground(58, 68);  ground(73, 95);
  ground(99, 129); ground(132, 177);

  set(9, 9, '?');
  coinsRow(10, 12, 8);
  set(14, 9, 'B'); set(15, 9, '?'); set(16, 9, 'B'); set(17, 9, '?'); set(18, 9, 'B');
  set(16, 5, '?');

  pipe(22, 2); pipe(28, 3); pipe(33, 3);

  coinsRow(36, 37, 10);
  set(41, 9, 'B'); set(42, 9, 'B'); set(43, 9, '?'); set(44, 9, 'B'); set(45, 9, 'B');
  coinsRow(41, 45, 5);

  pipe(49, 3);

  coinsRow(55, 57, 9);
  set(60, 9, '?'); set(61, 9, 'B'); set(62, 9, '?');

  stair(64, 4, 1);
  coinsRow(65, 66, 7);
  set(69, 9, 'B'); set(70, 9, '?'); set(71, 9, 'B');

  set(76, 9, '?'); set(78, 9, '?');
  coinsRow(81, 84, 9);
  pipe(87, 2);
  set(91, 9, 'B'); set(92, 9, 'B'); set(93, 9, '?'); set(94, 9, 'B');

  coinsRow(96, 98, 9);
  coinsRow(100, 101, 8);
  set(104, 9, '?'); set(106, 9, '?'); set(105, 5, 'B'); set(106, 5, 'B');

  stair(110, 4, 1);
  stair(115, 4, -1);
  coinsRow(112, 113, 6);

  pipe(122, 3);
  set(126, 9, 'B'); set(127, 9, '?'); set(128, 9, 'B');
  coinsRow(126, 128, 5);

  coinsRow(133, 134, 10);
  set(136, 9, '?'); set(137, 9, 'B'); set(138, 9, '?');
  pipe(141, 2);
  set(145, 9, 'B'); set(146, 9, '?'); set(147, 9, 'B');
  coinsRow(145, 147, 5);

  stair(150, 8, 1);
  set(flagX, 12, '#');
}

/* ---------- 世界 2-1 · 地下迷窟 ---------- */
function buildWorld2() {
  LEVEL_W = 180; flagX = 166; castleC = 171;
  spawn = { x: 64 };
  enemySpawns = [12, 17, 22, 33, 43, 57, 63, 73, 88, 92, 94, 102, 122, 124, 126, 131, 145, 148];

  ground(0, 23); ground(26, 38); ground(42, 65); ground(69, 79);
  ground(83, 103); ground(107, 137); ground(140, 179);
  // 洞顶
  for (let c = 0; c < LEVEL_W; c++) set(c, 0, '#');

  set(8, 9, '?');

  // 砖块走廊（可从砖下穿过捡金币，也可跳上砖顶）
  bricksRow(10, 18, 10);
  coinsRow(11, 17, 12);
  set(13, 7, 'B'); set(14, 7, '?'); set(15, 7, 'B');
  coinsRow(13, 15, 5);

  pipe(20, 2);
  coinsRow(24, 25, 10);          // 第一坑
  set(27, 9, '?');

  // 双层砖隧道
  bricksRow(30, 36, 10);
  bricksRow(31, 35, 6);
  coinsRow(31, 35, 8);

  // 坑 + 单砖跳台
  set(40, 10, 'B');
  coinsRow(39, 41, 8);

  stair(44, 4, 1);
  coinsRow(46, 49, 8);
  stair(48, 4, -1);

  pipe(60, 3);
  coinsRow(66, 68, 9);           // 坑

  set(72, 9, '?'); set(74, 9, '?');
  coinsRow(75, 78, 12);

  // 坑 + 跳台
  set(81, 10, 'B');
  coinsRow(80, 82, 7);

  // 低矮砖顶通道（敌人在下方巡逻）
  bricksRow(86, 96, 8);
  set(90, 8, '?');
  coinsRow(87, 95, 11);

  pipe(100, 3);

  // 坑 + 跳台
  set(105, 10, 'B');
  coinsRow(104, 106, 8);

  // 石柱山（连续可攀爬，每级落差不超过 2 格）
  tower(111, 2); tower(112, 2); tower(113, 4); tower(114, 4); tower(115, 2); tower(116, 2);
  coinsRow(113, 115, 6);

  bricksRow(129, 133, 9);
  set(131, 9, '?');
  coinsRow(130, 132, 5);

  coinsRow(138, 139, 10);        // 坑
  pipe(143, 2);

  set(147, 9, '?'); set(149, 9, 'B'); set(150, 9, '?');

  stair(154, 8, 1);
  set(flagX, 12, '#');
}

/* ---------- 世界 3-1 · 星空险境 ---------- */
function buildWorld3() {
  LEVEL_W = 188; flagX = 174; castleC = 179;
  spawn = { x: 64 };
  enemySpawns = [11, 18, 26, 36, 40, 58, 60, 79, 84, 98, 100, 102, 112, 114, 116, 131, 145, 155, 157, 160];

  ground(0, 12); ground(15, 27); ground(31, 45); ground(50, 64);
  ground(68, 85); ground(89, 105); ground(109, 125); ground(129, 150); ground(153, 187);

  set(8, 9, '?'); set(10, 9, '?');
  coinsRow(13, 14, 10);          // 坑

  // 浮空平台区
  bricksRow(16, 18, 10);
  bricksRow(21, 23, 8);
  coinsRow(21, 23, 7);
  pipe(24, 3);

  // 坑 + 单砖跳台（砖块降至第 10 行，平地可跳上）
  set(29, 10, 'B');
  coinsRow(28, 30, 8);

  // 砖块问号阵
  set(34, 9, 'B'); set(35, 9, '?'); set(36, 9, 'B'); set(37, 9, '?'); set(38, 9, 'B');
  coinsRow(35, 37, 5);

  // 宽坑 + 双砖跳台
  set(47, 10, 'B'); set(48, 10, 'B');
  coinsRow(46, 49, 8);

  pipe(53, 3);
  coinsRow(57, 59, 9);
  set(62, 9, '?');

  coinsRow(65, 67, 9);           // 坑

  stair(70, 4, 1);
  stair(74, 4, -1);
  coinsRow(72, 75, 8);

  // 坑 + 跳台（砖块降至第 10 行，平地可跳上）
  set(87, 10, 'B');
  coinsRow(86, 88, 8);

  // 高低双层平台
  bricksRow(92, 95, 9);
  bricksRow(93, 94, 6);
  coinsRow(93, 94, 5);

  // 坑 + 跳台
  set(107, 10, 'B');
  coinsRow(106, 108, 8);

  set(120, 9, '?'); set(122, 9, '?');

  coinsRow(126, 128, 9);         // 坑

  stair(133, 4, 1);
  stair(137, 4, -1);
  coinsRow(135, 138, 8);

  pipe(147, 3);
  coinsRow(151, 152, 10);        // 坑

  set(156, 9, '?');
  stair(162, 8, 1);
  set(flagX, 12, '#');
}

function buildLevel(w) {
  grid = [];
  for (let r = 0; r < ROWS; r++) grid.push(new Array(400).fill('.'));
  pipes = [];
  if (w === 1) buildWorld1();
  else if (w === 2) buildWorld2();
  else buildWorld3();
  // 裁剪到实际宽度
  for (let r = 0; r < ROWS; r++) grid[r].length = LEVEL_W;
}

/* ================= 实体 ================= */
let player, enemies, particles, popCoins, bumps, camX, score, coins, lives, time, timeAcc;
let state = 'MENU';   // MENU | INTRO | PLAY | DYING | WIN | OVER | END | PAUSE
let animT = 0, stateT = 0, winPhase = 0, flagSlide = 0, fwAcc = 0;

function makePlayer() {
  return {
    x: spawn.x, y: 13 * TILE - 30, w: 22, h: 30,
    vx: 0, vy: 0, onGround: false, face: 1, animT: 0,
    coyote: 0, jbuf: 0, jumpHeld: false
  };
}
function enemySpeed() { return 0.6 + (world - 1) * 0.09; }

function resetLevel() {
  buildLevel(world);
  player = makePlayer();
  enemies = enemySpawns.map(c => ({
    x: c * TILE + 3, y: 13 * TILE - 27, w: 26, h: 26,
    vx: -enemySpeed(), vy: 0, onGround: false, squash: -1, dead: false, animT: Math.random() * 100
  }));
  particles = []; popCoins = []; bumps = [];
  camX = 0; timeAcc = 0; flagSlide = 0; winPhase = 0;
}
function enterLevel() {
  resetLevel();
  time = 300;
  state = 'INTRO'; stateT = 0;
  SFX.intro();
}
function startGame() {
  ensureAudio();
  world = 1; score = 0; coins = 0; lives = 3;
  enterLevel();
}

/* ================= 输入 ================= */
const keys = {};
const touch = { l: false, r: false, j: false };
const input = {
  left()  { return keys['ArrowLeft'] || keys['KeyA'] || touch.l; },
  right() { return keys['ArrowRight'] || keys['KeyD'] || touch.r; },
  jump()  { return keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touch.j; }
};
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
const RESTARTABLE = ['MENU', 'OVER', 'END'];

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  ensureAudio();
  if (JUMP_KEYS.includes(e.code) && player) player.jbuf = 8;
  if (e.code === 'Enter' || e.code === 'Space') {
    if (RESTARTABLE.includes(state)) startGame();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'PLAY' || state === 'PAUSE')) {
    state = state === 'PLAY' ? 'PAUSE' : 'PLAY';
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (JUMP_KEYS.includes(e.code) && player && player.vy < -4) player.vy = -4; // 短跳截断
});
cv.addEventListener('pointerdown', () => {
  ensureAudio();
  if (RESTARTABLE.includes(state)) startGame();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'PLAY') state = 'PAUSE';
});

/* 触屏按钮 */
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); ensureAudio(); touch[key] = true; el.classList.add('on');
                    if (key === 'j' && player) player.jbuf = 8;
                    if (key === 'j' && RESTARTABLE.includes(state)) startGame(); };
  const off = e => { e.preventDefault(); touch[key] = false; el.classList.remove('on');
                     if (key === 'j' && player && player.vy < -4) player.vy = -4; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('btnL', 'l'); bindBtn('btnR', 'r'); bindBtn('btnJ', 'j');

/* ================= 碰撞工具 ================= */
const SOLID = '#B?UP';
function tileAt(c, r) {
  if (c < 0 || c >= LEVEL_W) return '.';
  if (r < 0 || r >= ROWS) return '.';
  return grid[r][c];
}
function solidAtPx(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0) return true;
  if (c >= LEVEL_W || r < 0 || r >= ROWS) return false;
  return SOLID.includes(grid[r][c]);
}
function bumpOff(c, r) {
  for (const b of bumps) if (b.c === c && b.r === r) return -Math.sin(Math.min(1, b.t / 10) * Math.PI) * 7;
  return 0;
}

/* ================= 顶砖逻辑 ================= */
function hitBlock(c, r) {
  const ch = tileAt(c, r);
  if (ch === '?') {
    grid[r][c] = 'U';
    bumps.push({ c, r, t: 0 });
    popCoins.push({ x: c * TILE + TILE / 2, y: r * TILE - 6, vy: -6.5, t: 0 });
    addScore(200); coins++; SFX.coin();
    burst(c * TILE + TILE / 2, r * TILE - 8, '#ffd23f', 6);
  } else if (ch === 'B' || ch === 'U') {
    bumps.push({ c, r, t: 0 });
    SFX.bump();
  }
}

/* ================= 粒子 ================= */
function burst(x, y, color, n, spread) {
  spread = spread || 2.2;
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * spread * 2, vy: -Math.random() * 3 - 1,
      life: 26 + Math.random() * 14, color, size: 2 + Math.random() * 2.5, grav: 0.18
    });
  }
}
function firework(x, y) {
  const cols = ['#ff5a5a', '#ffd23f', '#6cf06c', '#6fc3ff', '#ff9de2'];
  const color = cols[Math.floor(Math.random() * cols.length)];
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 40 + Math.random() * 20, color, size: 2.5, grav: 0.05 });
  }
}

/* ================= 游戏逻辑（每 1/60s 一步） ================= */
const ACC = 0.32, MAXV = 3.4, GRAV = 0.6, JUMP_V = -11.9;

function addScore(n) { score += n; }

function step() {
  animT += 1 / 60;
  stateT++;

  if (state === 'PLAY') stepPlay();
  else if (state === 'DYING') stepDying();
  else if (state === 'WIN') stepWin();
  else if (state === 'INTRO') {
    if (stateT > 110) { state = 'PLAY'; stateT = 0; }
  }
  else if (state === 'END') {
    fwAcc++;
    if (fwAcc % 24 === 0) firework(camX + 80 + Math.random() * (W - 160), 60 + Math.random() * 180);
  }

  // 通用动画计时
  for (const b of bumps) b.t++;
  for (let i = bumps.length - 1; i >= 0; i--) if (bumps[i].t > 12) bumps.splice(i, 1);
  for (let i = popCoins.length - 1; i >= 0; i--) {
    const p = popCoins[i];
    p.y += p.vy; p.vy += 0.3; p.t++;
    if (p.t > 28) popCoins.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function stepPlay() {
  const p = player;

  /* ---- 计时器 ---- */
  timeAcc++;
  if (timeAcc >= 60) { timeAcc = 0; time--; if (time <= 0) { killPlayer(); return; } }

  /* ---- 水平移动 ---- */
  let want = 0;
  if (input.left())  want -= 1;
  if (input.right()) want += 1;
  if (want !== 0) {
    p.vx += want * ACC;
    p.face = want;
  } else {
    p.vx *= p.onGround ? 0.82 : 0.96;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
  }
  p.vx = Math.max(-MAXV, Math.min(MAXV, p.vx));

  /* ---- 跳跃（含土狼时间 + 跳跃缓冲） ---- */
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && p.coyote > 0) {
    p.vy = JUMP_V; p.onGround = false; p.coyote = 0; p.jbuf = 0; p.jumpHeld = true;
    SFX.jump();
    burst(p.x + p.w / 2, p.y + p.h, '#eaf6ff', 4, 1.4);
  }
  p.vy += GRAV;
  if (p.vy > 13) p.vy = 13;

  /* ---- X 轴碰撞 ---- */
  p.x += p.vx;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.vx > 0) {
    const xe = p.x + p.w;
    if (solidAtPx(xe, p.y + 2) || solidAtPx(xe, p.y + p.h / 2) || solidAtPx(xe, p.y + p.h - 2)) {
      p.x = Math.floor(xe / TILE) * TILE - p.w - 0.01; p.vx = 0;
    }
  } else if (p.vx < 0) {
    if (solidAtPx(p.x, p.y + 2) || solidAtPx(p.x, p.y + p.h / 2) || solidAtPx(p.x, p.y + p.h - 2)) {
      p.x = (Math.floor(p.x / TILE) + 1) * TILE + 0.01; p.vx = 0;
    }
  }

  /* ---- Y 轴碰撞 ---- */
  p.y += p.vy;
  p.onGround = false;
  if (p.vy > 0) {
    const ye = p.y + p.h;
    if (solidAtPx(p.x + 2, ye) || solidAtPx(p.x + p.w - 2, ye)) {
      p.y = Math.floor(ye / TILE) * TILE - p.h; p.vy = 0; p.onGround = true;
    }
  } else if (p.vy < 0) {
    if (solidAtPx(p.x + 2, p.y) || solidAtPx(p.x + p.w - 2, p.y)) {
      const r = Math.floor(p.y / TILE);
      p.y = (r + 1) * TILE + 0.01; p.vy = 0;
      const cMid = Math.floor((p.x + p.w / 2) / TILE);
      const cL = Math.floor((p.x + 2) / TILE), cR = Math.floor((p.x + p.w - 2) / TILE);
      let c = cMid;
      if (!SOLID.includes(tileAt(cMid, r))) c = SOLID.includes(tileAt(cL, r)) ? cL : cR;
      hitBlock(c, r);
    }
  }

  /* ---- 拾取金币 ---- */
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tileAt(c, r) === 'C') {
      grid[r][c] = '.';
      coins++; addScore(200); SFX.coin();
      burst(c * TILE + TILE / 2, r * TILE + TILE / 2, '#ffd23f', 6);
    }
  }

  /* ---- 动画计时 ---- */
  if (Math.abs(p.vx) > 0.3 && p.onGround) p.animT += Math.abs(p.vx) * 0.09;
  else if (p.onGround) p.animT = 0;

  /* ---- 敌人 ---- */
  stepEnemies(true);

  /* ---- 掉落深渊 ---- */
  if (p.y > ROWS * TILE + 40) { killPlayer(true); return; }

  /* ---- 到达旗杆 ---- */
  if (p.x + p.w >= flagX * TILE + 12) {
    state = 'WIN'; stateT = 0; winPhase = 0; flagSlide = 0;
    p.x = flagX * TILE + 12 - p.w; p.vx = 0; p.vy = 0;
    addScore(1000 + time * 10);
    SFX.win();
    return;
  }

  /* ---- 摄像机 ---- */
  const target = Math.max(0, Math.min(p.x - W * 0.38, LEVEL_W * TILE - W));
  camX += (target - camX) * 0.12;
}

function stepEnemies(interact) {
  const p = player;
  for (const g of enemies) {
    if (g.dead) continue;
    if (g.squash >= 0) { g.squash++; if (g.squash > 30) g.dead = true; continue; }
    // 只激活屏幕附近的敌人
    if (g.x > camX + W + 80) continue;
    g.animT += 1 / 60;

    g.vy += GRAV * 0.7; if (g.vy > 10) g.vy = 10;

    // X
    g.x += g.vx;
    if (g.vx > 0) {
      const xe = g.x + g.w;
      if (solidAtPx(xe, g.y + 4) || solidAtPx(xe, g.y + g.h - 3)) { g.x = Math.floor(xe / TILE) * TILE - g.w - 0.01; g.vx *= -1; }
    } else {
      if (solidAtPx(g.x, g.y + 4) || solidAtPx(g.x, g.y + g.h - 3)) { g.x = (Math.floor(g.x / TILE) + 1) * TILE + 0.01; g.vx *= -1; }
    }
    // Y
    g.y += g.vy;
    g.onGround = false;
    if (g.vy > 0) {
      const ye = g.y + g.h;
      if (solidAtPx(g.x + 3, ye) || solidAtPx(g.x + g.w - 3, ye)) { g.y = Math.floor(ye / TILE) * TILE - g.h; g.vy = 0; g.onGround = true; }
    }
    if (g.y > ROWS * TILE + 60) { g.dead = true; continue; }

    if (!interact) continue;

    /* ---- 与玩家碰撞 ---- */
    if (p.x < g.x + g.w && p.x + p.w > g.x && p.y < g.y + g.h && p.y + p.h > g.y) {
      const falling = p.vy > 0.5;
      const fromTop = (p.y + p.h) - g.y < 16;
      if (falling && fromTop) {
        g.squash = 0;
        p.vy = -7.2;
        addScore(100);
        SFX.stomp();
        burst(g.x + g.w / 2, g.y + g.h / 2, '#c8a06a', 8);
      } else {
        killPlayer();
        return;
      }
    }
  }
  // 敌人互相碰撞掉头
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead || a.squash >= 0 || a.x > camX + W + 80) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead || b.squash >= 0) continue;
      if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
        a.vx *= -1; b.vx *= -1;
        a.x += a.vx; b.x += b.vx;
      }
    }
  }
}

function killPlayer(fell) {
  if (state !== 'PLAY') return;
  state = 'DYING'; stateT = 0;
  SFX.die();
  if (!fell) player.vy = -9;
  player.vx = 0;
}
function stepDying() {
  const p = player;
  p.vy += GRAV * 0.8;
  p.y += p.vy;
  if (stateT > 30 && p.y > ROWS * TILE + 200) {
    lives--;
    if (lives > 0) {
      resetLevel();
      state = 'PLAY'; stateT = 0;
    } else {
      state = 'OVER'; stateT = 0;
    }
  }
}

function stepWin() {
  const p = player;
  stepEnemies(false);
  if (winPhase === 0) {                       // 沿旗杆滑下
    flagSlide = Math.min(flagSlide + 3, 8 * TILE);
    p.y = Math.min(p.y + 3, 12 * TILE - p.h);
    if (p.y >= 12 * TILE - p.h && flagSlide >= 8 * TILE) { winPhase = 1; stateT = 0; p.face = 1; }
  } else if (winPhase === 1) {                // 走向城堡
    p.x += 1.8; p.face = 1;
    p.animT += 0.16;
    p.vy += GRAV;
    p.y += p.vy;
    const ye = p.y + p.h;
    if (solidAtPx(p.x + 2, ye) || solidAtPx(p.x + p.w - 2, ye)) { p.y = Math.floor(ye / TILE) * TILE - p.h; p.vy = 0; }
    if (stateT > 150 || p.x > (castleC + 2.2) * TILE) { winPhase = 2; stateT = 0; }
    const target = Math.max(0, Math.min(p.x - W * 0.38, LEVEL_W * TILE - W));
    camX += (target - camX) * 0.12;
  } else {                                    // 烟花庆祝 → 进入下一关
    fwAcc++;
    if (fwAcc % 26 === 0) {
      firework(camX + 100 + Math.random() * (W - 200), 60 + Math.random() * 160);
    }
    if (stateT > 240) {
      if (world < MAX_WORLD) { world++; enterLevel(); }
      else { state = 'END'; stateT = 0; fwAcc = 0; }
    }
  }
}

function drawPixels(map, x, y, scale, flip) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const ch = flip ? row[row.length - 1 - c] : row[c];
      if (ch === '.') continue;
      ctx.fillStyle = PAL[ch] || '#000';
      ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
    }
  }
}

function marioFrame(p) {
  if (state === 'DYING') return M_DEAD;
  if (!p.onGround) return M_JUMP;
  if (Math.abs(p.vx) > 0.3) return (Math.floor(p.animT * 8) % 2 === 0) ? M_RUN1 : M_RUN2;
  return M_STAND;
}
// 某些帧底部有空行，补偿偏移让脚正好踩在碰撞盒底部（地面上）
function frameBottomPad(map) {
  for (let r = map.length - 1; r >= 0; r--) {
    for (let c = 0; c < map[r].length; c++) {
      if (map[r][c] !== '.') return (map.length - 1 - r) * 2;
    }
  }
  return 0;
}

function drawStars() {
  const off = -camX * 0.25;
  const span = LEVEL_W * TILE * 0.25 + W + 200;
  for (let i = 0; i < 70; i++) {
    const x = ((i * 173 + 47 + off) % span + span) % span - 100;
    const y = 12 + (i * 89) % 260;
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(animT * 2.4 + i * 1.7));
    ctx.fillStyle = `rgba(255,255,255,${0.25 + tw * 0.6})`;
    const s = (i % 3 === 0) ? 2.5 : 1.6;
    ctx.fillRect(x, y, s, s);

function drawCaveBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05070f');
  g.addColorStop(0.5, '#0d1428');
  g.addColorStop(1, '#15203e');

  const off = -camX * 0.4;

    const y = 40 + (i * 73) % 380;
    ctx.fillStyle = `rgba(110,150,230,${0.05 + (i % 5) * 0.02})`;
    ctx.fillRect(x, y, 3 + (i % 3), 3 + (i % 2));

}

function drawCloud(x, y, s, alpha) {
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath();
  ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
  ctx.arc(x + 20 * s, y - 9 * s, 19 * s, 0, Math.PI * 2);
  ctx.arc(x + 42 * s, y, 15 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(x - 14 * s, y, 70 * s, 14 * s);
}
function drawClouds(alpha) {
  const off = -camX * 0.35;
  const span = LEVEL_W * TILE * 0.35 + W + 300;
  for (let i = 0; i < 14; i++) {
    const cx = ((i * 337 + 120 + off) % span + span) % span - 150;
    const cy = 52 + (i % 3) * 34 + (i % 2) * 12;
    drawCloud(cx, cy, 0.8 + (i % 3) * 0.25, alpha);
  }
}
function drawHills(c1, c2) {
  const off = -camX * 0.5;
  const span = LEVEL_W * TILE * 0.5 + W + 600;
  for (let i = 0; i < 10; i++) {
    const hx = ((i * 560 + off) % span + span) % span - 300;
    const big = i % 2 === 0;
    const r = big ? 105 : 65;
    ctx.fillStyle = big ? c1 : c2;
    ctx.beginPath(); ctx.arc(hx, GROUND_R * TILE, r, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.arc(hx - r * 0.3, GROUND_R * TILE, r * 0.62, Math.PI, 0); ctx.fill();
  }
}
function drawBushes(color) {
  const positions = [6, 19, 41, 63, 82, 104, 124, 146];
  for (const c of positions) {
    if (c >= LEVEL_W - 4) continue;
    const x = c * TILE - camX;
    if (x < -150 || x > W + 150) continue;
    // 灌木下方必须是地面才绘制
    if (!SOLID.includes(tileAt(c, 13))) continue;
    const y = GROUND_R * TILE;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y - 8, 17, Math.PI * 0.9, Math.PI * 2.05);
    ctx.arc(x + 24, y - 12, 20, Math.PI * 0.9, Math.PI * 2.05);
    ctx.arc(x + 50, y - 8, 16, Math.PI * 0.95, Math.PI * 2.05);
    ctx.fill();
    ctx.fillRect(x - 16, y - 8, 82, 8);
  }
}
function drawBackground() {
  if (world === 1) {
    drawSkyDay(); drawClouds(0.92); drawHills('#3f9e46', '#57b65d'); drawBushes('#2f8f3a');

function drawCastle() {
  const x = Math.round(castleC * TILE - camX);
  const gy = GROUND_R * TILE;
  if (x < -260 || x > W + 60) return;
  const cave = world === 2;
  const brick = cave ? '#6a7288' : '#b8b8c0';
  const dark = cave ? '#3c4258' : '#71717e';
  const door = '#20242c';
  ctx.fillStyle = brick;
  ctx.fillRect(x, gy - 96, 160, 96);
  ctx.fillRect(x + 40, gy - 152, 80, 56);
  ctx.fillStyle = dark;
  for (let i = 0; i < 5; i++) ctx.fillRect(x + i * 34, gy - 110, 20, 14);
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 42 + i * 28, gy - 166, 18, 14);
  ctx.strokeStyle = cave ? 'rgba(20,24,40,.6)' : 'rgba(80,80,95,.5)';
  ctx.lineWidth = 1;
  for (let yy = gy - 88; yy < gy; yy += 16) {
    ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 160, yy); ctx.stroke();
  }
  ctx.fillStyle = door;
  ctx.beginPath();
  ctx.moveTo(x + 62, gy);
  ctx.lineTo(x + 62, gy - 44);
  ctx.arc(x + 80, gy - 44, 18, Math.PI, 0);
  ctx.lineTo(x + 98, gy);
  ctx.fill();
  ctx.fillRect(x + 18, gy - 74, 14, 20);
  ctx.fillRect(x + 128, gy - 74, 14, 20);
  ctx.fillRect(x + 72, gy - 140, 16, 20);
}

  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = '#7a4a00';
  ctx.fillRect(x, y + TILE - 3, TILE, 3);
  ctx.fillRect(x + TILE - 3, y, 3, TILE);
  ctx.fillRect(x + 2, y + 2, 3, 3); ctx.fillRect(x + TILE - 5, y + 2, 3, 3);
  ctx.fillRect(x + 2, y + TILE - 5, 3, 3); ctx.fillRect(x + TILE - 5, y + TILE - 5, 3, 3);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', x + TILE / 2, y + TILE / 2 + 1);
}
function drawUsedBlock(x, y) {
  ctx.fillStyle = '#9a6a3f';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#6e4526';
  ctx.fillRect(x, y + TILE - 3, TILE, 3);
  ctx.fillRect(x + TILE - 3, y, 3, TILE);
  ctx.fillRect(x + 2, y + 2, 3, 3); ctx.fillRect(x + TILE - 5, y + 2, 3, 3);
  ctx.fillRect(x + 2, y + TILE - 5, 3, 3); ctx.fillRect(x + TILE - 5, y + TILE - 5, 3, 3);
}
function drawCoinTile(x, y) {
  const t = animT * 4 + (x + y) * 0.01;
  const w = Math.abs(Math.cos(t)) * 9 + 2;
  const cx = x + TILE / 2, cy = y + TILE / 2;
  ctx.fillStyle = '#a8720a';
  ctx.beginPath(); ctx.ellipse(cx, cy, w, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(1, w - 2.5), 9.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.fillRect(cx - 1.5, cy - 6, 3, 12);
}
function drawPipeObj(p) {
  const x = Math.round(p.c * TILE - camX), y = Math.round(p.r * TILE);
  if (x + p.w * TILE < -10 || x > W + 10) return;
  const wpx = p.w * TILE;
  ctx.fillStyle = '#43b047';
  ctx.fillRect(x + 3, y + TILE, wpx - 6, (p.h - 1) * TILE);
  ctx.fillStyle = '#1e7a26';
  ctx.fillRect(x + wpx - 10, y + TILE, 7, (p.h - 1) * TILE);
  ctx.fillStyle = '#8fe08f';
  ctx.fillRect(x + 7, y + TILE, 6, (p.h - 1) * TILE);
  ctx.fillStyle = '#43b047';
  ctx.fillRect(x - 2, y, wpx + 4, TILE - 2);
  ctx.fillStyle = '#1e7a26';
  ctx.fillRect(x - 2, y + TILE - 6, wpx + 4, 4);
  ctx.fillRect(x + wpx - 6, y, 8, TILE - 2);
  ctx.fillStyle = '#8fe08f';
  ctx.fillRect(x + 3, y + 3, 8, TILE - 10);
  ctx.strokeStyle = '#14501a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 1, y + 1, wpx + 2, TILE - 4);
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c1 = Math.min(LEVEL_W - 1, c0 + Math.ceil(W / TILE) + 2);
  for (let r = 0; r < ROWS; r++) {
    for (let c = c0; c <= c1; c++) {
      const ch = grid[r][c];
      if (ch === '.' || ch === 'P') continue;
      const x = Math.round(c * TILE - camX);
      const y = Math.round(r * TILE + bumpOff(c, r));
      if (ch === '#') drawGroundTile(x, y);
      else if (ch === 'B') drawBrickTile(x, y);
      else if (ch === '?') drawQBlock(x, y);
      else if (ch === 'U') drawUsedBlock(x, y);
      else if (ch === 'C') drawCoinTile(x, y);
    }
  }
  for (const p of pipes) drawPipeObj(p);
}

/* ---- 敌人：栗子怪（程序化绘制） ---- */
function drawGoomba(g) {
  const x = Math.round(g.x - camX), y = Math.round(g.y);
  if (x + g.w < -20 || x > W + 20) return;
  if (g.squash >= 0) {
    ctx.fillStyle = '#8a4a1c';
    ctx.beginPath(); ctx.ellipse(x + 13, y + g.h - 5, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a2d0c';
    ctx.fillRect(x + 1, y + g.h - 4, 24, 4);
    return;
  }
  const step = Math.sin(g.animT * 12);
  ctx.fillStyle = '#9c511f';
  ctx.beginPath(); ctx.ellipse(x + 13, y + 13, 13, 12.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a2d0c';
  ctx.beginPath(); ctx.ellipse(x + 6 + step * 2.5, y + 24, 7, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 20 - step * 2.5, y + 24, 7, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8c39e';
  ctx.beginPath(); ctx.ellipse(x + 13, y + 16, 8.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x + 9, y + 12, 3.2, 4.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 17, y + 12, 3.2, 4.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#161616';
  ctx.beginPath(); ctx.ellipse(x + 9.8, y + 13.5, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 16.2, y + 13.5, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1c06';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 6, y + 7.5); ctx.lineTo(x + 11.5, y + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 20, y + 7.5); ctx.lineTo(x + 14.5, y + 10); ctx.stroke();
}

/* ---- HUD ---- */
function hudText(txt, x, y, size, align) {
  ctx.font = `bold ${size || 15}px "Courier New", monospace`;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillText(txt, x + 1.5, y + 1.5);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, x, y);
}
function drawHUD() {
  hudText('MARIO', 24, 10);
  hudText(String(score).padStart(6, '0'), 24, 28);
  ctx.fillStyle = '#a8720a';
  ctx.beginPath(); ctx.ellipse(196, 36, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.ellipse(196, 36, 5.5, 7, 0, 0, Math.PI * 2); ctx.fill();
  hudText('×' + String(coins).padStart(2, '0'), 210, 28);
  hudText(`世界 ${world}-1`, W / 2, 10, 15, 'center');
  hudText('TIME ' + Math.max(0, time), W / 2, 28, 15, 'center');
  hudText('生命 ×' + lives, W - 24, 28, 15, 'right');
}

/* ---- 覆盖层 ---- */
function panel(alpha) {
  ctx.fillStyle = `rgba(8,12,26,${alpha == null ? 0.55 : alpha})`;
  ctx.fillRect(0, 0, W, H);
}
function bigText(txt, y, size, color) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillText(txt, W / 2 + 3, y + 3);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(txt, W / 2, y);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawMenu() {
  panel(0.42);
  const lg = ctx.createLinearGradient(0, 92, 0, 196);
  lg.addColorStop(0, '#e73c2e'); lg.addColorStop(1, '#a31f14');
  ctx.fillStyle = lg;
  roundRect(W / 2 - 268, 88, 536, 116, 14); ctx.fill();
  ctx.strokeStyle = '#ffd8b0'; ctx.lineWidth = 4;
  roundRect(W / 2 - 268, 88, 536, 116, 14); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 58px "Microsoft YaHei", "Courier New", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('超级马里奥', W / 2, 132);
  ctx.font = 'bold 19px "Courier New", monospace';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('S U P E R   M A R I O', W / 2, 176);

  if (Math.floor(animT * 2) % 2 === 0) bigText('— 点击屏幕 或 按空格键 开始游戏 —', 252, 22, '#fff');
  bigText('三个世界：绿野平原 → 地下迷窟 → 星空险境', 298, 17, '#ffd23f');
  bigText('← → / A D 移动    空格 / ↑ / W 跳跃    P 暂停', 328, 15, '#cfe4ff');
  bigText('踩扁栗子怪 · 顶问号砖 · 吃金币 · 冲向旗杆！', 354, 15, '#cfe4ff');
  bigText('本游戏全部图形与音效均由代码实时生成', 392, 13, 'rgba(255,255,255,.55)');

  drawPixels(M_STAND, W / 2 - 306, 120, 3.4, false);
  drawPixels(M_JUMP, W / 2 + 270, 116, 3.4, true);
}
function drawIntro() {
  ctx.fillStyle = '#05070f';
  ctx.fillRect(0, 0, W, H);
  bigText(`世界 ${world}-1`, 180, 46, '#fff');
  bigText(WORLD_NAMES[world - 1], 232, 24, '#ffd23f');
  drawPixels(M_STAND, W / 2 - 60, 280, 3, false);
  hudText('MARIO ×' + lives, W / 2 + 6, 300, 18, 'left');
  if (stateT > 55 && Math.floor(animT * 3) % 2 === 0) bigText('READY ?', 400, 20, '#8fb8ff');
}
function drawGameOver() {
  panel(0.66);
  bigText('游 戏 结 束', 180, 54, '#e73c2e');
  bigText('GAME OVER', 230, 24, '#fff');
  bigText(`止步于 世界 ${world}-1 · ${WORLD_NAMES[world - 1]}`, 274, 17, '#cfe4ff');
  bigText(`最终得分 ${score}    金币 ×${coins}`, 302, 18, '#ffd23f');
  if (Math.floor(animT * 2) % 2 === 0) bigText('点击屏幕 或 按空格键 重新开始', 356, 20, '#fff');
}
function drawWin() {
  if (winPhase < 2) {
    hudText('CLEAR!', W / 2 - 60, 120, 30, 'left');
    return;
  }
  bigText(`世界 ${world}-1 通关！`, 130, 30, '#ffd23f');
  if (world < MAX_WORLD) {
    bigText(`即将进入 世界 ${world + 1}-1 · ${WORLD_NAMES[world]} ...`, 172, 18, '#cfe4ff');
  }
}
function drawEnd() {
  panel(0.5);
  bigText('🏆 恭 喜 通 关 全 部 世 界 ！', 160, 44, '#ffd23f');
  bigText('THANK YOU MARIO!', 210, 22, '#fff');
  bigText(`总得分 ${score}    金币 ×${coins}    剩余生命 ×${lives}`, 262, 18, '#fff');
  bigText('绿野平原 ✓    地下迷窟 ✓    星空险境 ✓', 292, 15, '#cfe4ff');
  if (Math.floor(animT * 2) % 2 === 0) bigText('点击屏幕 或 按空格键 再玩一次', 350, 20, '#fff');
}
function drawPause() {
  panel(0.5);
  bigText('暂 停', 210, 46, '#fff');
  bigText('按 P 或 Esc 继续', 262, 18, '#cfe4ff');
}

/* ================= 渲染 ================= */
function render() {
  drawBackground();
  drawCastle();
  drawFlag();
  drawTiles();

  // 金币弹出动画
  for (const p of popCoins) {
    const w = Math.abs(Math.cos(p.t * 0.5)) * 8 + 2;
    ctx.fillStyle = '#a8720a';
    ctx.beginPath(); ctx.ellipse(p.x - camX, p.y, w, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(p.x - camX, p.y, Math.max(1, w - 2), 8.5, 0, 0, Math.PI * 2); ctx.fill();
  }

  for (const g of enemies) if (!g.dead) drawGoomba(g);

  // 玩家
  if (state !== 'OVER' && state !== 'END' && state !== 'MENU') {
    const frame = marioFrame(player);
    const px = Math.round(player.x - camX) - 1;
    const py = Math.round(player.y) + player.h - 32 + frameBottomPad(frame);
    drawPixels(frame, px, py, 2, player.face < 0);
  }

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 18);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (state !== 'INTRO') drawHUD();

  if (state === 'MENU') drawMenu();
  else if (state === 'INTRO') drawIntro();
  else if (state === 'OVER') drawGameOver();
  else if (state === 'WIN') drawWin();
  else if (state === 'END') drawEnd();
  else if (state === 'PAUSE') drawPause();
}

/* ================= 主循环（固定步长 60Hz） ================= */
buildLevel(1);
resetLevel();
state = 'MENU';
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - last; last = now;
  if (dt > 60) dt = 60;
  acc += dt;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
}
requestAnimationFrame(frame);
</script>
